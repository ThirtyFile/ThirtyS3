[package]
name = "thirtys3-core"
description = "The shared parts of ThirtyS3: Signature Version 4 signing and verification, S3 XML, errors, ETags and checksums"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["s3", "aws", "sigv4"]
categories = ["network-programming"]

[dependencies]
base64 = "0.23.1"
crc-fast = "1.10.0"
hmac = "0.13.0"
md-5 = "0.11.0"
quick-xml = "0.42.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh64", "xxh3"] }

[lints]
workspace = true

[dev-dependencies]
aws-credential-types = "1.3.0"
aws-sigv4 = "1.6.0"
http = "1.5.0"
serde_json = "1.0.154"
