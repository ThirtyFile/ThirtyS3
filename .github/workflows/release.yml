# Makes a release, started by hand: Actions > Release > Run workflow, with the version number (the one in the workspace Cargo.toml: the three crates
# thirtys3-core, thirtys3-client and thirtys3-server have the same version).
# Scans main with CodeQL (codeql.yml; it stops on open alerts of high or critical severity), runs the checks on main (checks.yml), packages the crates, publishes them on crates.io by itself, thirtys3-core first,, and then makes the GitHub release, which creates the tag
# v1.2.3 on the commit that was checked. The token is the secret CARGO_REGISTRY_TOKEN of the environment "crates-io", which only main can use.
# Crates cannot be taken back from crates.io, only yanked: start the workflow when the version is meant to be published.
# Nothing is published or tagged if the scan, the checks or the package fail. When a later step fails, run the workflow again with the same version: a crate that
# is on crates.io already is not published again, and the release is made from the same commit of main as long as nothing was tagged.
#
# Pre-releases (1.2.3-rc.1, anything with a "-") are published on crates.io too (cargo and Cargo.lock ignore them unless asked for) and marked as
# pre-releases on GitHub.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, such as 1.2.3 or 1.2.3-rc.1 (without the v). It must be the version in Cargo.toml"
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      published: ${{ steps.check.outputs.published }}
      notes_start: ${{ steps.check.outputs.notes_start }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # Sorts versions the way semantic versioning does, pre-releases before their release:
          # 1.2.3-rc.2 < 1.2.3-rc.10 < 1.2.3 (sort -V puts "~" before everything, even the end)
          vsort() { sed 's/-/~/' | sort -V | sed 's/~/-/'; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Releases are made from main: choose main under \"Use workflow from\"."
          VERSION="${VERSION#v}"
          echo "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            || fail "\"$VERSION\" is not a version number such as 1.2.3, or 1.2.3-rc.1 for a pre-release."
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$crate" = "$VERSION" ] || fail "Cargo.toml says $crate. Change the version in a pull request first, and merge it."
          # The crates depend on each other by version: the dependency on thirtys3-core has to be at this version too
          grep -qF "thirtys3-core = { path = \"crates/thirtys3-core\", version = \"$VERSION\" }" Cargo.toml || fail "The dependency on thirtys3-core in Cargo.toml has to say version $VERSION."
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && fail "v$VERSION has already been released."

          previous=$(git tag -l 'v*' | sed 's/^v//' | vsort | tail -n 1)
          if [ -n "$previous" ]; then
            newest=$(printf '%s\n%s\n' "$previous" "$VERSION" | vsort | tail -n 1)
            [ "$newest" = "$VERSION" ] || fail "$VERSION must be newer than the last release, v$previous."
            if [ -z "$(git log --oneline "v$previous..HEAD")" ]; then
              fail "Nothing has changed on main since v$previous."
            fi
          fi

          # Are these versions on crates.io already? (A run that published them and failed afterwards is run again to make the release; one that
          # published only some of them is run again to publish the rest.)
          published=true
          for name in thirtys3-core thirtys3-client thirtys3-server; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "ThirtyFile release workflow (https://github.com/ThirtyFile/ThirtyS3)" "https://crates.io/api/v1/crates/$name/$VERSION")
            case "$status" in
              200) echo "$name $VERSION is on crates.io already: it is not published again." ;;
              404) published=false ;;
              *) fail "crates.io answered $status." ;;
            esac
          done

          case "$VERSION" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          # The notes of a release list everything since the previous release, skipping the pre-releases in between
          notes_start=""
          if [ "$prerelease" = false ]; then
            last=$(git tag -l 'v*' | sed 's/^v//' | grep -v -- - | vsort | tail -n 1) || true
            if [ -n "$last" ]; then notes_start="v$last"; fi
          fi
          {
            echo "version=$VERSION"
            echo "prerelease=$prerelease"
            echo "published=$published"
            echo "notes_start=$notes_start"
          } >> "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL
    needs: prepare
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  checks:
    name: Checks
    needs: prepare
    uses: ./.github/workflows/checks.yml

  package:
    name: Package
    needs: [prepare, codeql, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo package --workspace --locked
      - name: Checksums
        run: |
          cd target/package
          for crate in thirtys3-*-${{ needs.prepare.outputs.version }}.crate; do
            sha256sum "$crate" > "$crate.sha256"
            cat "$crate.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: |
            target/package/thirtys3-*-${{ needs.prepare.outputs.version }}.crate
            target/package/thirtys3-*-${{ needs.prepare.outputs.version }}.crate.sha256
          if-no-files-found: error

  publish:
    name: Publish on crates.io
    needs: [prepare, package]
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment holds the token, and only main can use it
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || {
            echo "::error::Add the secret CARGO_REGISTRY_TOKEN to the environment crates-io first."
            exit 1
          }
          # The core first: the other two need it on crates.io (cargo waits for it to show in the index). One that is there already is left alone.
          for name in thirtys3-core thirtys3-client thirtys3-server; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "ThirtyFile release workflow (https://github.com/ThirtyFile/ThirtyS3)" "https://crates.io/api/v1/crates/$name/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$name $VERSION is on crates.io already."
              continue
            fi
            cargo publish -p "$name" --locked
          done

  release:
    name: GitHub release
    needs: [prepare, package, publish]
    # The crate is on crates.io: published now, or by an earlier run
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          NOTES_START: ${{ needs.prepare.outputs.notes_start }}
          SHA: ${{ github.sha }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$SHA" --title "v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); else args+=(--latest); fi
          if [ -n "$NOTES_START" ]; then args+=(--notes-start-tag "$NOTES_START"); fi
          # Creating the release creates the tag v$VERSION on the commit that was checked
          gh release create "v$VERSION" "${args[@]}" thirtys3-*-"$VERSION".crate thirtys3-*-"$VERSION".crate.sha256
